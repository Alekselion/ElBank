name: elbank

x-app-env: &app-env
  # Inside the compose network services are reached by name, not localhost.
  APP_ENV: dev
  LOG_JSON: "true"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  LOGSTASH_HOST: logstash
  LOGSTASH_PORT: 5000
  WIREMOCK_BASE_URL: http://wiremock:8080
  ELASTIC_URL: http://elasticsearch:9200
  KYC_UPLOADS_DIR: /app/uploads
  STATEMENTS_DIR: /app/uploads/statements
  EXPORTS_DIR: /app/uploads/exports
  SUPPORT_UPLOADS_DIR: /app/uploads/support

services:
  # ================================================================ application
  migrate:
    build: .
    image: elbank:latest
    env_file: .env
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  elbank-app:
    build: .
    image: elbank:latest
    env_file: .env
    environment: *app-env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - kyc_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      wiremock:
        condition: service_healthy
      logstash:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status != 200)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Kafka consumer of statement.requested: writes CSV statements to the shared
  # uploads volume, from where elbank-app serves them.
  statement-worker:
    build: .
    image: elbank:latest
    env_file: .env
    environment: *app-env
    command: ["elbank-statements-worker"]
    volumes:
      - kyc_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      logstash:
        condition: service_healthy
    healthcheck:
      disable: true  # no HTTP port; the process exits (and restarts) on fatal errors
    stop_grace_period: 30s
    restart: unless-stopped

  # Kafka consumer of export.requested: writes CSV/PDF operation history to the shared
  # uploads volume, from where elbank-app serves them.
  exports-worker:
    build: .
    image: elbank:latest
    env_file: .env
    environment: *app-env
    command: ["elbank-exports-worker"]
    volumes:
      - kyc_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      logstash:
        condition: service_healthy
    healthcheck:
      disable: true  # no HTTP port; the process exits (and restarts) on fatal errors
    stop_grace_period: 30s
    restart: unless-stopped

  # Kafka consumer of operation.completed: drops the analytics cache of the account
  # owner and checks budgets (notification.send warn/danger).
  # Scales up to the number of partitions of operation.completed.
  operations-worker:
    build: .
    image: elbank:latest
    env_file: .env
    environment: *app-env
    command: ["elbank-operations-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      logstash:
        condition: service_healthy
    healthcheck:
      disable: true  # no HTTP port; the process exits (and restarts) on fatal errors
    stop_grace_period: 30s
    restart: unless-stopped

  # Accrues deposit interest on deposit.interest.tick (POST /api/v1/admin/deposits/accrue).
  # Safe to scale: deposits are taken with SELECT ... FOR UPDATE SKIP LOCKED.
  deposit-worker:
    build: .
    image: elbank:latest
    env_file: .env
    environment: *app-env
    command: ["elbank-deposits-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      logstash:
        condition: service_healthy
    healthcheck:
      disable: true  # no HTTP port; the process exits (and restarts) on fatal errors
    stop_grace_period: 30s
    restart: unless-stopped

  # Completes pending transfers after the cancel window and publishes transfer.completed
  # (and operation.completed for every completed posting).
  # Safe to scale: due transfers are taken with SELECT ... FOR UPDATE SKIP LOCKED.
  transfers-worker:
    build: .
    image: elbank:latest
    env_file: .env
    environment: *app-env
    command: ["elbank-transfers-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      logstash:
        condition: service_healthy
    healthcheck:
      disable: true  # no HTTP port
    stop_grace_period: 30s
    restart: unless-stopped

  # ==================================================================== storage
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ================================================================== messaging
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    environment:
      # KRaft: this single node is both broker and controller, no ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # PLAINTEXT :9092 — inside the compose network; EXTERNAL :29092 — from the host.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Creates domain topics up front (idempotent) so the first publish does not
  # race topic auto-creation. Add new event types to TOPICS.
  kafka-init:
    image: apache/kafka:4.1.0
    environment:
      TOPICS: >-
        user.registered user.deleted profile.updated notification.send
        kyc.requested kyc.decided
        account.opened account.closed account.blocked account.unblocked
        statement.requested export.requested operation.completed
        transfer.completed transfer.failed transfer.reversed
        payment.processed payment.failed
        card.issued card.blocked card.unblocked
        credit.approved credit.rejected credit.signed credit.closed
        deposit.opened deposit.closed deposit.interest.tick
        investment.order.created
        ticket.created ticket.updated
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in $${TOPICS}; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$${topic}" --partitions 3 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "${KAFKA_UI_HOST_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: elbank
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ======================================================== external API mocks
  wiremock:
    image: wiremock/wiremock:3.13.1
    command: ["--global-response-templating", "--disable-banner"]
    ports:
      - "${WIREMOCK_HOST_PORT:-8081}:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      - ./wiremock/__files:/home/wiremock/__files:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/__admin/health > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ======================================================================== ELK
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.17.4}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION:-8.17.4}
    environment:
      ELASTIC_URL: http://elasticsearch:9200
      XPACK_MONITORING_ENABLED: "false"
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      # Don't lose events: buffer on disk while Elasticsearch is slow/unavailable,
      # and keep documents Elasticsearch rejects (mapping errors) in the DLQ.
      QUEUE_TYPE: persisted
      DEAD_LETTER_QUEUE_ENABLE: "true"
    ports:
      - "5000:5000"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ls_data:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9600/_node/pipelines/main > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-8.17.4}
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # One-shot: create the "elbank-logs-*" data view so logs are visible in Discover.
  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.17.4}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        curl -fsS -X POST http://kibana:5601/api/data_views/data_view \
          -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
          -d '{"override": true, "data_view": {"id": "elbank-logs", "name": "ElBank logs", "title": "elbank-logs-*", "timeFieldName": "@timestamp"}}' > /dev/null
        curl -fsS -X POST http://kibana:5601/api/data_views/default \
          -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
          -d '{"data_view_id": "elbank-logs", "force": true}' > /dev/null
        echo "Kibana data view elbank-logs-* is ready"
    depends_on:
      kibana:
        condition: service_healthy
    restart: "no"

volumes:
  pg_data:
  redis_data:
  kafka_data:
  es_data:
  ls_data:
  kyc_uploads:
