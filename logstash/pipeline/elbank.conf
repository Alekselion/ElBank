# ElBank log pipeline.
#
# The app ships logs with python-logstash-async: one JSON object per line over TCP,
# with the fields timestamp, level, logger, message, correlation_id, service, env.
#
# Nothing is dropped here: malformed lines are kept (tagged _jsonparsefailure, raw
# text in "message"), events missing mandatory fields get defaults, a bad timestamp
# only adds a tag. The persisted queue and DLQ (docker-compose.yml) cover the
# Elasticsearch side.

input {
  tcp {
    port  => 5000
    codec => json_lines
    # Keep the app's own fields as-is; peer address goes to "host"/"port".
    ecs_compatibility => disabled
  }
}

filter {
  # Use the application's event time for @timestamp; keep the original field too.
  if [timestamp] {
    date {
      match          => ["timestamp", "ISO8601"]
      target         => "@timestamp"
      tag_on_failure => ["_timestamp_parse_failure"]
    }
  }

  # Mandatory fields: fill in defaults instead of rejecting events from other senders.
  if ![service] {
    mutate { add_field => { "service" => "unknown" } }
  }
  if ![env] {
    mutate { add_field => { "env" => "unknown" } }
  }
  if ![level] {
    mutate { add_field => { "level" => "INFO" } }
  }

  mutate {
    uppercase => ["level"]
  }
}

output {
  # Audit records (elbank.core.audit: log_type=audit) go to their own index with a strict
  # mapping (templates/elbank-audit.json); GET /api/v1/admin/audit reads elbank-audit-*.
  if [log_type] == "audit" {
    elasticsearch {
      hosts           => ["${ELASTIC_URL}"]
      index           => "elbank-audit-%{+YYYY.MM.dd}"
      manage_template => true
      template        => "/usr/share/logstash/templates/elbank-audit.json"
      template_name   => "elbank-audit"
      template_api    => "composable"
      template_overwrite => true
    }
  } else {
    elasticsearch {
      hosts => ["${ELASTIC_URL}"]
      index => "elbank-logs-%{+YYYY.MM.dd}"
    }
  }
  stdout {
    codec => json_lines
  }
}
