# ElBank log pipeline.
# The app ships logs with python-logstash-async: one JSON document per line over TCP.

input {
  tcp {
    port  => 5000
    codec => json_lines
    # Event fields come from the app itself; don't overwrite "host" with the peer address.
    ecs_compatibility => disabled
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTIC_URL}"]
    index => "elbank-%{+YYYY.MM.dd}"
  }
}
