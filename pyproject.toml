[project]
name = "elbank"
version = "0.1.0"
description = "ElBank — electronic bank emulator"
readme = "README.md"
authors = [
    { name = "Alexey Kokorev", email = "akokorev@rasoft.ru" }
]
requires-python = ">=3.15"
dependencies = [
    "aiokafka>=0.15.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "fpdf2>=2.9",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.9.5",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-jose[cryptography]>=3.5.0",
    "python-logstash-async>=4.1.0",
    "python-multipart>=0.0.34",
    "redis>=8.2.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
elbank = "elbank.__main__:main"
elbank-deposits-worker = "elbank.workers.deposits:main"
elbank-exports-worker = "elbank.workers.exports:main"
elbank-operations-worker = "elbank.workers.operations:main"
elbank-statements-worker = "elbank.workers.statements:main"
elbank-transfers-worker = "elbank.workers.transfers:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "BLE", "C4", "SIM", "RUF", "PL", "TRY", "PTH"]
ignore = [
    "PLR0913",  # FastAPI handlers/factories legitimately take many arguments
    "TRY003",   # short messages in exceptions are fine
    "S101",     # asserts are used for type narrowing
]

[tool.ruff.lint.isort]
known-first-party = ["elbank"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.15"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["elbank"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["aiokafka.*", "jose.*", "passlib.*", "logstash_async.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
